name: Deploy

# Seance is a public repository, so it holds no registry or server credential
# and cannot deploy itself. A private deploy workflow is the only builder and
# deployer: this workflow just tells it which commit to release, using a
# GitHub App token minted from the one secret this repo does hold.
#
# CI is the gate. The deploy workflow independently verifies that the
# commit is reachable from main and that this repo's ci.yml passed for it, so
# dispatching before CI finishes would simply be refused. Waiting for the ci
# workflow_run is what makes a push to main deploy on its own.
#
# Manual dispatch re-releases the current main head, for retrying a failed
# deploy without an empty commit.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  dispatch-deploy:
    name: Dispatch the deploy
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Verify the upstream product checks ran
        id: product-checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('release', 'true');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, filter: 'latest', per_page: 100
            });
            const required = ["test"];
            const ran = required.every(name => jobs.some(job => job.name === name && job.conclusion === 'success'));
            core.setOutput('release', String(ran));

      - name: Check the deploy dispatch configuration
        if: steps.product-checks.outputs.release == 'true'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          SEANCE_DEPLOY_WORKFLOW: ${{ secrets.SEANCE_DEPLOY_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$SEANCE_DEPLOY_WORKFLOW" ] || missing="$missing SEANCE_DEPLOY_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The deploy dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint deploy GitHub App token
        if: steps.product-checks.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the CI-verified commit
        if: steps.product-checks.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          SEANCE_DEPLOY_WORKFLOW: ${{ secrets.SEANCE_DEPLOY_WORKFLOW }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run "$SEANCE_DEPLOY_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" --ref main \
            -f seance_sha="$SOURCE_SHA"
          echo "Dispatched the deploy for $SOURCE_SHA"
